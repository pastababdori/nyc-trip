<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혬채의 두근두근 연말 뉴욕 여행</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --red-holiday: #d90429;
            --green-holiday: #2b9348;
            --gold-accent: #ffb703;
            --text-main: #1d3557;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* 눈 내리는 애니메이션 */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .snowflake {
            position: absolute;
            color: #fff;
            font-size: 1rem;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            color: #fff;
        }

        header h1 {
            font-family: 'Jua', sans-serif;
            font-size: 2.2rem;
            color: #ffd166;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            color: #f1faee;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* 탭 메뉴 */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 6px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--red-holiday);
            color: #fff;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 카드 스타일 */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 10px;
        }

        .card-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.3rem;
            color: var(--red-holiday);
        }

        .badge {
            background: var(--green-holiday);
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        /* 일정 목록 */
        .item-list {
            list-style: none;
        }

        .item {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .item:last-child {
            border-bottom: none;
        }

        .time {
            font-weight: bold;
            color: var(--green-holiday);
            width: 70px;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .details {
            flex-grow: 1;
        }

        .details h4 {
            font-size: 1rem;
            color: #2b2d42;
            margin-bottom: 3px;
        }

        .details p {
            font-size: 0.85rem;
            color: #6c757d;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #a8a29e;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .btn-icon:hover {
            color: var(--red-holiday);
        }

        /* 추가 버튼 */
        .add-btn-container {
            text-align: center;
            margin-top: 15px;
        }

        .btn-add {
            background: var(--green-holiday);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(43, 147, 72, 0.3);
            transition: transform 0.2s;
        }

        .btn-add:active {
            transform: scale(0.95);
        }

        /* 사진 앨범 전용 스타일 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .photo-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .photo-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            padding: 8px;
            font-size: 0.8rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: modalUp 0.3s ease;
        }

        @keyframes modalUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.4rem;
            color: var(--red-holiday);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #495057;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #e9ecef;
            color: #495057;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-save {
            background: var(--red-holiday);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 로딩 스피너 */
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- 눈 내리는 효과 -->
    <div class="snowflakes" id="snowflakes"></div>

    <header>
        <h1>🎄 2026 NEW YORK 🗽</h1>
        <p>혬채의 두근두근 연말 뉴욕 여행</p>
    </header>

    <div class="container">
        <!-- 탭 네비게이션 -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('itinerary')">🗓️ 일정표</button>
            <button class="tab-btn" onclick="switchTab('vouchers')">🎟️ 바우처</button>
            <button class="tab-btn" onclick="switchTab('photos')">📷 사진 앨범</button>
        </div>

        <!-- 1. 일정표 탭 -->
        <div id="itinerary" class="tab-content active">
            <div id="itinerary-list">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> 실시간 일정을 불러오는 중...</div>
            </div>
            <div class="add-btn-container">
                <button class="btn-add" onclick="openItineraryModal()"><i class="fas fa-plus"></i> 새 일정 추가하기</button>
            </div>
        </div>

        <!-- 2. 바우처 탭 -->
        <div id="vouchers" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">✈️ 항공권 & 숙소 바우처</span>
                    <span class="badge">실시간 공유</span>
                </div>
                <div id="voucher-list">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 바우처 불러오는 중...</div>
                </div>
                <div class="add-btn-container">
                    <button class="btn-add" onclick="openVoucherModal()"><i class="fas fa-plus"></i> 바우처/티켓 추가</button>
                </div>
            </div>
        </div>

        <!-- 3. 사진 앨범 탭 -->
        <div id="photos" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📸 추억 사진 공유함</span>
                    <span class="badge">모든 기기 실시간 연동</span>
                </div>
                <p style="font-size:0.85rem; color:#666;">스마트폰이나 컴퓨터에서 올린 사진이 서로의 기기에도 바로 실시간으로 떠요!</p>
                <div class="photo-grid" id="photo-grid">
                    <div class="loading" style="grid-column: span 2;"><i class="fas fa-spinner fa-spin"></i> 사진 앨범을 불러오는 중...</div>
                </div>
                <div class="add-btn-container">
                    <button class="btn-add" onclick="openPhotoModal()"><i class="fas fa-camera"></i> 사진 올리기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 일정 추가/수정 모달 -->
    <div class="modal" id="itinerary-modal">
        <div class="modal-content">
            <div class="modal-title" id="itinerary-modal-title">일정 추가하기</div>
            <input type="hidden" id="edit-itinerary-id">
            <div class="form-group">
                <label>날짜 / 구분</label>
                <input type="text" id="itinerary-date" placeholder="예: Day 1 (12/24 수)">
            </div>
            <div class="form-group">
                <label>시간</label>
                <input type="text" id="itinerary-time" placeholder="예: 14:00">
            </div>
            <div class="form-group">
                <label>일정 제목</label>
                <input type="text" id="itinerary-title" placeholder="예: 타임스퀘어 야경 감상">
            </div>
            <div class="form-group">
                <label>메모 / 세부사항</label>
                <textarea id="itinerary-desc" rows="3" placeholder="예: 예쁜 트리 앞에서 스냅 사진 찍기!"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('itinerary-modal')">취소</button>
                <button class="btn-save" onclick="saveItinerary()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 바우처 추가 모달 -->
    <div class="modal" id="voucher-modal">
        <div class="modal-content">
            <div class="modal-title">바우처 등록하기</div>
            <div class="form-group">
                <label>종류</label>
                <input type="text" id="voucher-type" placeholder="예: 에어프레미아 항공권 / Hotel 예약">
            </div>
            <div class="form-group">
                <label>예약 번호 / 메모</label>
                <input type="text" id="voucher-code" placeholder="예: CONF-8273910A">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('voucher-modal')">취소</button>
                <button class="btn-save" onclick="saveVoucher()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 사진 추가 모달 -->
    <div class="modal" id="photo-modal">
        <div class="modal-content">
            <div class="modal-title">추억 사진 올리기</div>
            <div class="form-group">
                <label>사진 선택</label>
                <input type="file" id="photo-input" accept="image/*">
            </div>
            <div class="form-group">
                <label>사진 설명</label>
                <input type="text" id="photo-caption" placeholder="예: 브루클린 브릿지에서 📸">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('photo-modal')">취소</button>
                <button class="btn-save" onclick="savePhoto()">업로드</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Version 9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc, serverTimestamp, query, orderBy } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 설정 (복사해 주신 키 값 연동 완료)
        const firebaseConfig = {
            apiKey: "AIzaSyA1oEi0Iuz0Sfb9JgEoQaHx7t4Ve01YDvI",
            authDomain: "nyc-trip-pastababdori.firebaseapp.com",
            projectId: "nyc-trip-pastababdori",
            storageBucket: "nyc-trip-pastababdori.firebasestorage.app",
            messagingSenderId: "191759674501",
            appId: "1:191759674501:web:05c3fd06cac48c40718dec",
            measurementId: "G-HP9D7YS8B8"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 전역 변수로 데이터베이스 연결 지정
        window.db = db;
        window.firestoreTools = { collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc, serverTimestamp, query, orderBy };

        // 페이지 로드시 실시간 데이터 바인딩 시작
        initRealtimeSync();
    </script>

    <script>
        // 눈 내리는 배경 효과 생성
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const flakes = ['❄', '❅', '❆', '✨', '🎄'];
            for (let i = 0; i < 35; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = flakes[Math.floor(Math.random() * flakes.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's';
                flake.style.fontSize = (Math.random() * 0.8 + 0.8) + 'rem';
                container.appendChild(flake);
            }
        }
        createSnowflakes();

        // 탭 전환 함수
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 모달 열기/닫기
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openItineraryModal(id = null, date = '', time = '', title = '', desc = '') {
            document.getElementById('edit-itinerary-id').value = id || '';
            document.getElementById('itinerary-date').value = date;
            document.getElementById('itinerary-time').value = time;
            document.getElementById('itinerary-title').value = title;
            document.getElementById('itinerary-desc').value = desc;
            document.getElementById('itinerary-modal-title').innerText = id ? '일정 수정하기' : '새 일정 추가하기';
            document.getElementById('itinerary-modal').style.display = 'flex';
        }

        function openVoucherModal() {
            document.getElementById('voucher-modal').style.display = 'flex';
        }

        function openPhotoModal() {
            document.getElementById('photo-modal').style.display = 'flex';
        }

        // --- Firebase 실시간 동기화 및 CRUD logic ---
        function initRealtimeSync() {
            const checkFirebase = setInterval(() => {
                if (window.db && window.firestoreTools) {
                    clearInterval(checkFirebase);
                    const { db, firestoreTools } = window;
                    const { collection, onSnapshot, query, orderBy } = firestoreTools;

                    // 1. 일정표 실시간 구독
                    onSnapshot(collection(db, "itineraries"), (snapshot) => {
                        const listContainer = document.getElementById('itinerary-list');
                        if (snapshot.empty) {
                            listContainer.innerHTML = '<div class="card" style="text-align:center;">아직 추가된 일정이 없어요. 아래 버튼으로 추가해 보세요! 🗽</div>';
                            return;
                        }

                        // 날짜별 그룹화
                        const grouped = {};
                        snapshot.docs.forEach(docSnap => {
                            const data = docSnap.data();
                            data.id = docSnap.id;
                            const dateKey = data.date || '날짜 미지정';
                            if (!grouped[dateKey]) grouped[dateKey] = [];
                            grouped[dateKey].push(data);
                        });

                        let html = '';
                        for (const [date, items] of Object.entries(grouped)) {
                            html += `
                            <div class="card">
                                <div class="card-header">
                                    <span class="card-title">📅 ${date}</span>
                                </div>
                                <ul class="item-list">`;
                            
                            items.forEach(item => {
                                html += `
                                <li class="item">
                                    <div class="time">${item.time || ''}</div>
                                    <div class="details">
                                        <h4>${item.title}</h4>
                                        <p>${item.desc || ''}</p>
                                    </div>
                                    <div class="item-actions">
                                        <button class="btn-icon" onclick="openItineraryModal('${item.id}', '${item.date}', '${item.time}', '${item.title}', '${item.desc}')"><i class="fas fa-edit"></i></button>
                                        <button class="btn-icon" onclick="deleteItinerary('${item.id}')"><i class="fas fa-trash"></i></button>
                                    </div>
                                </li>`;
                            });

                            html += `</ul></div>`;
                        }
                        listContainer.innerHTML = html;
                    });

                    // 2. 바우처 실시간 구독
                    onSnapshot(collection(db, "vouchers"), (snapshot) => {
                        const voucherContainer = document.getElementById('voucher-list');
                        if (snapshot.empty) {
                            voucherContainer.innerHTML = '<p style="font-size:0.9rem; color:#888; text-align:center; padding:15px;">등록된 바우처가 없습니다.</p>';
                            return;
                        }

                        let html = '<ul class="item-list">';
                        snapshot.docs.forEach(docSnap => {
                            const data = docSnap.data();
                            html += `
                            <li class="item">
                                <div class="details">
                                    <h4>🎫 ${data.type}</h4>
                                    <p>번호/메모: <strong>${data.code}</strong></p>
                                </div>
                                <button class="btn-icon" onclick="deleteVoucher('${docSnap.id}')"><i class="fas fa-trash"></i></button>
                            </li>`;
                        });
                        html += '</ul>';
                        voucherContainer.innerHTML = html;
                    });

                    // 3. 사진 앨범 실시간 구독
                    onSnapshot(collection(db, "photos"), (snapshot) => {
                        const photoGrid = document.getElementById('photo-grid');
                        if (snapshot.empty) {
                            photoGrid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#888; padding:20px;">함께 찍은 첫 뉴욕 사진을 올려보세요! 📸</p>';
                            return;
                        }

                        let html = '';
                        snapshot.docs.forEach(docSnap => {
                            const data = docSnap.data();
                            html += `
                            <div class="photo-card">
                                <img src="${data.url}" alt="뉴욕 추억 사진">
                                <div class="photo-info">
                                    <span>${data.caption || '뉴욕 추억'}</span>
                                    <button class="btn-icon" onclick="deletePhoto('${docSnap.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>`;
                        });
                        photoGrid.innerHTML = html;
                    });
                }
            }, 200);
        }

        // --- 데이터 추가/수정/삭제 처리 함수들 ---
        async function saveItinerary() {
            const id = document.getElementById('edit-itinerary-id').value;
            const date = document.getElementById('itinerary-date').value;
            const time = document.getElementById('itinerary-time').value;
            const title = document.getElementById('itinerary-title').value;
            const desc = document.getElementById('itinerary-desc').value;

            if (!title) return alert('일정 제목을 입력해 주세요!');

            const { db, firestoreTools } = window;
            const { collection, addDoc, doc, updateDoc } = firestoreTools;

            if (id) {
                await updateDoc(doc(db, "itineraries", id), { date, time, title, desc });
            } else {
                await addDoc(collection(db, "itineraries"), { date, time, title, desc, createdAt: new Date() });
            }

            closeModal('itinerary-modal');
        }

        async function deleteItinerary(id) {
            if (confirm('이 일정을 삭제하시겠습니까?')) {
                const { db, firestoreTools } = window;
                await firestoreTools.deleteDoc(firestoreTools.doc(db, "itineraries", id));
            }
        }

        async function saveVoucher() {
            const type = document.getElementById('voucher-type').value;
            const code = document.getElementById('voucher-code').value;

            if (!type || !code) return alert('정보를 모두 입력해 주세요!');

            const { db, firestoreTools } = window;
            await firestoreTools.addDoc(firestoreTools.collection(db, "vouchers"), { type, code, createdAt: new Date() });

            document.getElementById('voucher-type').value = '';
            document.getElementById('voucher-code').value = '';
            closeModal('voucher-modal');
        }

        async function deleteVoucher(id) {
            if (confirm('바우처를 삭제하시겠습니까?')) {
                const { db, firestoreTools } = window;
                await firestoreTools.deleteDoc(firestoreTools.doc(db, "vouchers", id));
            }
        }

        // 사진 용량 압축 및 업로드 (Base64 변환)
        async function savePhoto() {
            const fileInput = document.getElementById('photo-input');
            const caption = document.getElementById('photo-caption').value;

            if (!fileInput.files || !fileInput.files[0]) return alert('사진 파일을 선택해 주세요!');

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    // 이미지 크기 및 화질 압축
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    const { db, firestoreTools } = window;
                    await firestoreTools.addDoc(firestoreTools.collection(db, "photos"), {
                        url: compressedDataUrl,
                        caption: caption,
                        createdAt: new Date()
                    });

                    document.getElementById('photo-input').value = '';
                    document.getElementById('photo-caption').value = '';
                    closeModal('photo-modal');
                }
            }
            reader.readAsDataURL(file);
        }

        async function deletePhoto(id) {
            if (confirm('이 사진을 앨범에서 삭제하시겠습니까?')) {
                const { db, firestoreTools } = window;
                await firestoreTools.deleteDoc(firestoreTools.doc(db, "photos", id));
            }
        }
    </script>
</body>
